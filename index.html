
<!DOCTYPE html>
<html>
<head>
<title>Cybersecurity Training Lab</title>
<style>
body {
  font-family: Arial;
  background: #eaf0f8;
  padding: 25px;
  text-align: center;
}
.box {
  background: white;
  padding: 25px;
  border-radius: 12px;
  max-width: 350px;
  margin: auto;
}
input, button {
  box-sizing: border-box;
  width: 100%;
  padding: 12px;
  margin: 10px 0;
}
button {
  background: #174b91;
  color: white;
  border: none;
  border-radius: 6px;
}
</style>
</head>
<body>
<div class="box">
<h2>Cybersecurity Training Lab</h2>
<p>Enter dummy information for this exercise.</p>

<form id="trainingForm">
<input type="email" id="email"
placeholder="Test email" required>

<input type="text" id="testInfo"
placeholder="Dummy test value" required>

<button type="submit">Submit Test</button>
</form>

<p id="result"></p>
</div>

<script>
document.getElementById("trainingForm")
.addEventListener("submit", function(event) {
  event.preventDefault();

  const email = document.getElementById("email").value;

  document.getElementById("result").textContent =
    "Training completed for " + email +
    ". No password was collected.";

  this.reset();
});
</script>
</body>
</html>
